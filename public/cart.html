<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your cart — Kessler Goods</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <div class="brand-area">
      <a href="/index.html" class="wordmark" aria-label="Kessler Goods Store home"><img src="/assets/images/kessler-goods-logo.svg" alt="Kessler Goods Store" /></a>
      <span class="brand-tagline">Everyday goods, made to last.</span>
    </div>
    <nav class="main-nav">
      <a href="/index.html">Shop</a>
      <a href="/cart.html" class="cart-link">Cart <span class="cart-count" id="navCartCount" data-empty="true">0</span></a>
      <span id="navAuthArea" class="nav-auth-area"><a href="/login.html" class="login-btn">Log in</a></span>
    </nav>
  </div>
</header>

<main class="wrap">
  <h1 style="padding-top:40px;">Your cart</h1>

  <div class="cart-layout">
    <div id="cartLines">
      <div class="empty-state">Loading your cart…</div>
    </div>

    <aside class="summary-card">
      <h3>Order summary</h3>
      <div class="summary-row">
        <span>Subtotal</span>
        <span id="summarySubtotal">Rs. 0</span>
      </div>
      <div class="summary-row">
        <span>Shipping</span>
        <span>Calculated at pickup</span>
      </div>
      <div class="summary-row total">
        <span>Total</span>
        <span id="summaryTotal">Rs. 0</span>
      </div>
      <button class="btn btn-full" id="checkoutBtn" style="margin-top:20px;">Proceed to checkout</button>

      <div id="checkoutPanel" class="checkout-panel" style="display:none;">
        <div id="formMessage" class="form-message"></div>
        <form id="checkoutForm">
          <div class="field">
            <label for="fullName">Full name</label>
            <input type="text" id="fullName" required />
          </div>
          <div class="field">
            <label for="address">Street address</label>
            <input type="text" id="address" required />
          </div>
          <div class="field-row">
            <div class="field">
              <label for="city">City</label>
              <input type="text" id="city" required />
            </div>
            <div class="field">
              <label for="postalCode">Postal code</label>
              <input type="text" id="postalCode" required />
            </div>
          </div>
          <div class="field">
            <label for="country">Country</label>
            <input type="text" id="country" required />
          </div>
          <button type="submit" class="btn btn-full" id="placeOrderBtn">Place order</button>
        </form>
      </div>
    </aside>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>© 2026 Kessler Goods</span>
    <span>Everyday goods, made to last.</span>
  </div>
</footer>

<script src="/js/api.js"></script>
<script src="/js/cart-store.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/cart.js"></script>
</body>
</html>
