<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your orders — Kessler Goods</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <div class="brand-area">
      <a href="/index.html" class="wordmark" aria-label="Kessler Goods Store home"><img src="/assets/images/kessler-goods-logo.svg" alt="Kessler Goods Store" /></a>
      <span class="brand-tagline">Everyday goods, made to last.</span>
    </div>
    <nav class="main-nav">
      <a href="/index.html">Shop</a>
      <a href="/cart.html" class="cart-link">Cart <span class="cart-count" id="navCartCount" data-empty="true">0</span></a>
      <span id="navAuthArea" class="nav-auth-area"><a href="/login.html" class="login-btn">Log in</a></span>
    </nav>
  </div>
</header>

<main class="wrap orders-page">
  <h1 style="margin-bottom:8px;">Your orders</h1>
  <p class="muted" style="margin-bottom:32px;">A record of everything you've ordered from us.</p>
  <div id="confirmationBanner" class="form-message success" style="display:none;"></div>
  <div id="ordersList">
    <div class="empty-state">Loading…</div>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>© 2026 Kessler Goods</span>
    <span>Everyday goods, made to last.</span>
  </div>
</footer>

<script src="/js/api.js"></script>
<script src="/js/cart-store.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/orders.js"></script>
</body>
</html>
