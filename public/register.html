<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create an account — Kessler Goods</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <div class="brand-area">
      <a href="/index.html" class="wordmark" aria-label="Kessler Goods Store home"><img src="/assets/images/kessler-goods-logo.svg" alt="Kessler Goods Store" /></a>
      <span class="brand-tagline">Everyday goods, made to last.</span>
    </div>
    <nav class="main-nav">
      <a href="/index.html">Shop</a>
      <a href="/cart.html" class="cart-link">Cart <span class="cart-count" id="navCartCount" data-empty="true">0</span></a>
      <span id="navAuthArea" class="nav-auth-area"><a href="/login.html" class="login-btn">Log in</a></span>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="form-card">
    <h1>Create an account</h1>
    <p class="sub">Takes about thirty seconds. No newsletter unless you ask for one.</p>

    <div id="formMessage" class="form-message"></div>

    <form id="registerForm">
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" required autocomplete="name" />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="password-field">
          <input type="password" id="password" required autocomplete="new-password" minlength="8" />
          <button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.1A10.8 10.8 0 0 1 12 5c5.5 0 9.3 4.5 10 7-0.3 1-1.1 2.4-2.4 3.7M6.6 6.6C4.6 8 3.4 10.2 3 12c0.7 2.5 4.5 7 9 7 0.9 0 1.8-0.2 2.6-0.5"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-full" id="submitBtn">Create account</button>
    </form>

    <div class="form-foot">
      Already have an account? <a href="/login.html">Log in</a>
    </div>
  </div>
</main>

<script src="/js/api.js"></script>
<script src="/js/cart-store.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/auth.js" data-mode="register"></script>
</body>
</html>
